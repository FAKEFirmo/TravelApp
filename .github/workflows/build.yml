# Builds run on GitHub's machines, so release/iOS tooling (Xcode project generation, CocoaPods, …) never has to be
# installed locally. Download results from the run's "Artifacts" section, or: gh run download -R FAKEFirmo/TravelApp
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm test
      - run: cargo test
        working-directory: src-tauri
      # ponytail: unsigned build; add Apple signing secrets when distributing outside this Mac
      - run: npx tauri build --bundles dmg
      - uses: actions/upload-artifact@v5
        with:
          name: little-prince-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios-sim }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: command -v xcodegen || brew install xcodegen
      # ponytail: the Xcode project is generated fresh each run; commit src-tauri/gen/apple once it needs custom settings
      - run: npx tauri ios init --ci
      - run: npx tauri icon src-tauri/icons/app-icon-ios.png
      # Exported backups go to the app's Documents folder: make it visible in the Files app
      - name: Show app folder in Files
        run: |
          plist=$(find src-tauri/gen/apple -name Info.plist -path "*_iOS*" | head -1)
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$plist"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$plist"
      - run: npx tauri ios build --debug --target aarch64-sim --ci
      - name: Collect simulator app
        run: |
          app=$(find src-tauri/gen/apple/build -name "*.app" -type d -path "*sim*" | head -1)
          echo "Found: $app"
          test -n "$app"
          ditto -c -k --keepParent "$app" little-prince-ios-simulator.zip
      - uses: actions/upload-artifact@v5
        with:
          name: little-prince-ios-simulator
          path: little-prince-ios-simulator.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      # ponytail: unsigned installer (Windows shows a SmartScreen warning once); add code signing if it's ever shared
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v5
        with:
          name: little-prince-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      # The runner ships the Android SDK and NDK; Tauri finds the NDK through NDK_HOME
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      # ponytail: the Android project is generated fresh each run, like iOS; commit src-tauri/gen/android if it needs custom settings
      - run: npx tauri android init --ci
      - run: npx tauri icon src-tauri/icons/app-icon-ios.png
      # Samsung phones are 64-bit ARM. With a signing key (repo secrets) build a release APK and sign it with that
      # same key every time, so updates install over the previous version and keep your data. Without one, a
      # debug build (installable, but each build is signed differently).
      - if: env.HAS_KEY == 'true'
        run: npx tauri android build --apk --target aarch64 --ci
      - if: env.HAS_KEY != 'true'
        run: npx tauri android build --apk --target aarch64 --debug --ci
      - name: Sign
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > release.p12
          unsigned=$(find src-tauri/gen/android -name "*release-unsigned.apk" | head -1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:PASSWORD --out little-prince.apk aligned.apk
          rm release.p12
      - name: Collect debug APK
        if: env.HAS_KEY != 'true'
        run: cp "$(find src-tauri/gen/android -name "*debug.apk" | head -1)" little-prince.apk
      - uses: actions/upload-artifact@v5
        with:
          name: little-prince-android
          path: little-prince.apk

  # Web / home-screen version on GitHub Pages: https://fakefirmo.github.io/TravelApp/
  # (open in Safari → Share → Add to Home Screen; works offline, data stays on the device)
  web:
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
